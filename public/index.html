<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Information Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; padding: 0 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; font-size: 16px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .status { margin-top: 15px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <h2>User Registration</h2>
  <form id="profileForm">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" required>
    </div>
    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" required>
    </div>
    <div class="form-group">
      <label for="socials">Social Media Links</label>
      <input type="text" id="socials" placeholder="e.g. @instagram / linkedin">
    </div>
    <button type="submit">Submit Data</button>
  </form>

  <div id="statusMessage" class="status"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('uid');
    const statusDiv = document.getElementById('statusMessage');

    async function initForm() {
      if (!userId) {
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'Error: Missing user ID in URL.';
        return;
      }

      try {
        const response = await fetch(`/api/user/${userId}`);
        const result = await response.json();

        if (result.success) {
          document.getElementById('name').value = result.data.name;
          document.getElementById('phone').value = result.data.phone;
          document.getElementById('socials').value = result.data.socials;
          statusDiv.style.color = 'green';
          statusDiv.innerText = 'Welcome back! Your details have been auto-filled.';
        }
      } catch (err) {
        console.log('New user profile or lookup failed.');
      }
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!userId) return alert('Cannot submit: Missing UID in URL.');

      const payload = {
        uid: userId,
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        socials: document.getElementById('socials').value
      };

      try {
        const response = await fetch('/api/user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
          statusDiv.style.color = 'green';
          statusDiv.innerText = 'Information saved successfully!';
        } else {
          statusDiv.style.color = 'red';
          statusDiv.innerText = 'Error: ' + result.message;
        }
      } catch (err) {
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'Server error occurred while saving.';
      }
    });

    initForm();
  </script>
</body>
</html>
